name: Vault Multi-League Automated Update

on:
  schedule:
    # Runs every Thursday at 9:00 AM UTC (prior week fully settled; ahead of Thursday Night Football)
    - cron: '0 9 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no database writes)'
        required: false
        default: false
        type: boolean
      league:
        description: 'Specific league slug to update (leave empty for all)'
        required: false
        default: ''
        type: string

jobs:
  sync-vault-leagues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Multi-League Vault Sync Pipeline
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}
        run: |
          CMD="node scripts/update_vault_leagues.js"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ inputs.league }}" ]; then
            CMD="$CMD --league=${{ inputs.league }}"
          fi
          echo "Executing: $CMD"
          $CMD
