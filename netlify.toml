[build]
  command = "npm run build"
  publish = "dist"

# Static assets pass-through
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Route Dumbarton League HQ
[[redirects]]
  from = "/dmsfantasy"
  to = "/dmsfantasy/index.html"
  status = 200

[[redirects]]
  from = "/dmsfantasy/*"
  to = "/dmsfantasy/index.html"
  status = 200

# Route Gaywood / Katz Dad League HQ
[[redirects]]
  from = "/gaywoodfantasy"
  to = "/gaywoodfantasy/index.html"
  status = 200

[[redirects]]
  from = "/gaywoodfantasy/*"
  to = "/gaywoodfantasy/index.html"
  status = 200

# API endpoints
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Landing page root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Fallback for dynamic league vaults
[[redirects]]
  from = "/*"
  to = "/vault.html"
  status = 200
